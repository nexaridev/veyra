</style></head><body><div id="game"></div><script>(function (host) {
 'use strict';
 const SIZE = 480, LIMIT = 360;
 class Engine {
  constructor(random = Math.random) { this.random = random; this.reset(); }
  reset() { this.wave = 1; this.lives = 3; this.time = 0; this.elapsed = 0; this.intermission = 1.5; this.spawn = 0; this.shots = 0; this.bullets = []; this.player = {x:240,y:300}; this.invincible = 0; this.dash = 0; this.cooldown = 0; this.dead = false; }
  get duration() { return 12 + Math.min(10, this.wave * .25); }
  get speed() { return 90 + 29 * Math.log2(this.wave + 1); }
  add(x,y,vx,vy,r = 5,warm = .55) { if (this.bullets.length < LIMIT) this.bullets.push({x,y,vx,vy,r,warm,age:0}); }
  aimed(x,y,speed = this.speed) { const dx=this.player.x-x,dy=this.player.y-y,l=Math.hypot(dx,dy)||1; this.add(x,y,dx/l*speed,dy/l*speed); }
  pattern() {

   if(kind===0){const edge=k%4,t=30+r()*420; this.aimed(edge===0?0:edge===1?480:t,edge===2?0:edge===3?480:t);}
   else if(kind===1){const x=45+r()*390,y=20,count=5+Math.min(7,Math.floor(n/4));for(let i=0;i<count;i++){const a=Math.PI*.15+Math.PI*.7*i/(count-1);this.add(x,y,Math.cos(a)*s,Math.sin(a)*s);}}
   else if(kind===2){const gap=60+r()*360,horizontal=k%2===0;for(let t=12;t<480;t+=29)if(Math.abs(t-gap)>55){if(horizontal)this.add(t,0,0,s*.82,5,.8);else this.add(0,t,s*.82,0,5,.8);}}
   else if(kind===3){const angle=k*.49;for(let i=0;i<3;i++){const a=angle+i*Math.PI*2/3;this.add(240,30,Math.cos(a)*s,Math.sin(a)*s,5,.7);}}
   else if(kind===4){const x=k%2?0:480,y=30+r()*420;this.aimed(x,y,s);this.add(x,y,(k%2?1:-1)*s*.8,s*.45);this.add(x,y,(k%2?1:-1)*s*.8,-s*.45);}
   else {const count=6+Math.min(8,Math.floor(n/5)),x=k%2?35:445,y=35;for(let i=0;i<count;i++){const a=i*Math.PI*2/count+k*.21;this.add(x,y,Math.cos(a)*s,Math.sin(a)*s,5,.7);}}
  }
  step(dt,input={}) {
   if(this.dead)return;dt=Math.max(0,Math.min(.04,dt));this.elapsed+=dt;this.cooldown=Math.max(0,this.cooldown-dt);this.invincible=Math.max(0,this.invincible-dt);this.dash=Math.max(0,this.dash-dt);
   let dx=Number(input.x)||0,dy=Number(input.y)||0,len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len;}
   if(input.dash&&this.cooldown===0){this.dash=.16;this.invincible=Math.max(this.invincible,.18);this.cooldown=1.8;}
   const speed=this.dash>0?640:input.slow?125:235;
   this.player.x=Math.max(10,Math.min(470,this.player.x+dx*speed*dt));this.player.y=Math.max(10,Math.min(470,this.player.y+dy*speed*dt));
   if(this.intermission>0){this.intermission-=dt;return;}
   this.time+=dt;this.spawn-=dt;
   if(this.time>=this.duration){this.wave++;this.time=0;this.intermission=1.8;this.bullets=[];this.spawn=0;this.shots=0;if(this.wave%4===0)this.lives=Math.min(3,this.lives+1);return;}
   if(this.spawn<=0){this.pattern();const spacing=(this.wave-1)%6===2?2.1:Math.max(.11,.68/(1+(this.wave-1)*.075));this.spawn=spacing;}

   this.bullets=this.bullets.filter(b=>b.age<12&&b.x>-65&&b.y>-65&&b.x<545&&b.y<545);

(function(host){

  function start(){if(game.dead){game.reset();started=false;}started=true;paused=false;keys.clear();overlay.hidden=true;previous=0;canvas.focus({preventScroll:true});}
  on(primary,'click',start);on(root.querySelector('.dodge-pause'),'click',()=>paused?start():pause());
  on(host,'keydown',e=>{if(!root.isConnected||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','shift',' ','p','escape'].includes(k)){e.preventDefault();if((k==='p'||k==='escape')&&!e.repeat){paused?start():pause();return;}if(!started&&k===' '){start();return;}keys.add(k);}});
  on(host,'keyup',e=>keys.delete(e.key.toLowerCase()));on(host,'blur',pause);on(document,'visibilitychange',()=>{if(document.hidden)pause();});

  on(canvas,'pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect();drag={x:(e.clientX-r.left)*480/r.width,y:(e.clientY-r.top)*480/r.height};});for(const event of ['pointerup','pointercancel','lostpointercapture'])on(canvas,event,()=>drag=null);

   if(!paused){let x=Number(keys.has('d')||keys.has('arrowright')||held.has('right'))-Number(keys.has('a')||keys.has('arrowleft')||held.has('left')),y=Number(keys.has('s')||keys.has('arrowdown')||held.has('down'))-Number(keys.has('w')||keys.has('arrowup')||held.has('up'));if(drag){const dx=drag.x-game.player.x,dy=drag.y-game.player.y,l=Math.hypot(dx,dy);x=l>6?dx/Math.max(l,20):0;y=l>6?dy/Math.max(l,20):0;}game.step(dt,{x,y,slow:keys.has('shift'),dash:keys.has(' ')});keys.delete(' ');saveBest();if(game.dead){paused=true;modal(w[9],w[10]+' '+game.wave,w[11]);}}
   ctx.fillStyle='#100d18';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#ffffff06';ctx.lineWidth=1;for(let p=24;p<480;p+=32){ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,480);ctx.moveTo(0,p);ctx.lineTo(480,p);ctx.stroke();}
   for(const b of game.bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r+(b.warm>0?3:0),0,Math.PI*2);if(b.warm>0){ctx.strokeStyle='#ffbb7655';ctx.stroke();}else{ctx.fillStyle='#ffbb76';ctx.fill();}}
   const p=game.player;ctx.save();ctx.translate(p.x,p.y);if(!game.invincible||Math.floor(now/85)%2===0){ctx.fillStyle=game.dash>0?'#f0e9ff':'#bca5ff';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(9,2);ctx.lineTo(0,8);ctx.lineTo(-9,2);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-2,-2,4,4);}ctx.restore();
   if(!paused&&game.intermission>0){ctx.fillStyle='#eee9ff';ctx.textAlign='center';ctx.font='600 23px system-ui';ctx.fillText(game.wave===1?w[16]:w[14],240,205);ctx.font='16px system-ui';ctx.fillStyle='#b6a0ff';ctx.fillText(w[2]+' '+game.wave,240,235);}
   if(lastWave!==game.wave||lastLives!==game.lives){root.querySelector('[data-wave]').textContent=game.wave;root.querySelector('[data-lives]').textContent=game.lives;lastWave=game.wave;lastLives=game.lives;}
   root.querySelector('[data-best]').textContent=best;root.querySelector('.dodge-meter i').style.width=(game.time/game.duration*100)+'%';const dash=root.querySelector('.dodge-dash');dash.textContent=game.cooldown>0?game.cooldown.toFixed(1)+' s':w[12];
   frame=host.requestAnimationFrame(draw);
  }

 }
 host.VeyraGame={mount};
})(window);
