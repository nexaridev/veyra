plugins { id 'com.android.application' }
android {
 namespace 'dev.veyra.browser'
 compileSdk 37
 buildToolsVersion "36.0.0"
 defaultConfig { applicationId 'dev.veyra.browser'; minSdk 26; targetSdk 35; versionCode 10; versionName '0.6.6'; ndk { abiFilters 'arm64-v8a' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
  debug { if(project.hasProperty('veyraSigningStore')) { storeFile file(project.property('veyraSigningStore')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
  release { if(project.hasProperty('veyraReleaseStore')) { storeFile file(project.property('veyraReleaseStore')); storePassword System.getenv('VEYRA_ANDROID_STORE_PASSWORD'); keyAlias 'androiddebugkey'; keyPassword System.getenv('VEYRA_ANDROID_KEY_PASSWORD') } }
 }
 packaging { jniLibs { useLegacyPackaging true } }
 buildTypes { debug { debuggable true }; release { minifyEnabled false; debuggable false; if(project.hasProperty('veyraReleaseStore')) signingConfig signingConfigs.release } }
}
dependencies { implementation 'org.mozilla.geckoview:geckoview:158.0.20261021001945' }
