name: Build test artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/crypto-060.cjs
      - run: node tests/game-engine.cjs
      - run: node tests/localization-070.cjs
      - run: node tests/site-070.mjs
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/TEST-INSTALLER.ps1
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Veyra-Windows-0.7.0
          path: dist-v0.7.0/Veyra-win32-x64/
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: gradle -p android --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Veyra-Android-0.5.0-CI-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
